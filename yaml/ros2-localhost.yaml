apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ros2-deamonset-1
spec:
  selector:
    matchLabels:
      app: ros2-deamonset-1
  template:
    metadata:
      labels:
        app: ros2-deamonset-1
    spec:
      containers:
      - image: tomoyafujita/ros:rolling
        command: ["/bin/bash", "-c"]
        args: ["source /opt/ros/$ROS_DISTRO/setup.bash && ros2 run demo_nodes_cpp talker"]
        imagePullPolicy: IfNotPresent
        tty: true
        name: ros2-talker-1
        env:
          # ROS_LOCALHOST_ONLY=1 is deprecated since ROS 2 Iron, use ROS_AUTOMATIC_DISCOVERY_RANGE instead.
          - name: ROS_AUTOMATIC_DISCOVERY_RANGE
            value: "LOCALHOST"
      - image: tomoyafujita/ros:rolling
        command: ["/bin/bash", "-c"]
        args: ["source /opt/ros/$ROS_DISTRO/setup.bash && ros2 run demo_nodes_py listener"]
        imagePullPolicy: IfNotPresent
        tty: true
        name: ros2-listener-1
        env:
          - name: ROS_AUTOMATIC_DISCOVERY_RANGE
            value: "LOCALHOST"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      restartPolicy: Always

---

