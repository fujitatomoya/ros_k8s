apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ubuntu24-deamonset
spec:
  selector:
    matchLabels:
      app: ubuntu24
  template:
    metadata:
      labels:
        app: ubuntu24
    spec:
      containers:
      - name: ubuntu24
        tty: true
        image: ubuntu:24.04
        command: ["/bin/bash", "-c"]
        args: ["sleep 3600"]
        imagePullPolicy: IfNotPresent
      #hostNetwork: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      restartPolicy: Always
