apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ros1-deamonset
spec:
  selector:
    matchLabels:
      app: ros1
  template:
    metadata:
      labels:
        app: ros1
    spec:
      containers:
      - name: ros1-master
        tty: true
        image: tomoyafujita/ros:noetic
        command: ["/bin/bash", "-c"]
        args: ["ulimit -n 65536; source /opt/ros/$ROS_DISTRO/setup.bash && roscore"]
        imagePullPolicy: IfNotPresent
      - name: ros1-talker
        tty: true
        image: tomoyafujita/ros:noetic
        command: ["/bin/bash", "-c"]
        args: ["ulimit -n 65536; source /opt/ros/$ROS_DISTRO/setup.bash && until rostopic list; do sleep 1; done && rostopic pub -r 1 chatter std_msgs/String \"Hello, world\" __name:=talker"]
        imagePullPolicy: IfNotPresent
      - name: ros1-listener
        tty: true
        image: tomoyafujita/ros:noetic
        command: ["/bin/bash", "-c"]
        args: ["ulimit -n 65536; source /opt/ros/$ROS_DISTRO/setup.bash && until rostopic list; do sleep 1; done && rostopic echo chatter __name:=listener"]
        imagePullPolicy: IfNotPresent
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      #- key: node.kubernetes.io/disk-pressure
      #  operator: Exists
      #  effect: NoSchedule
      restartPolicy: Always
