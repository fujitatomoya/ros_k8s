# kind multiple node cluster description.
# see https://kind.sigs.k8s.io/docs/user/configuration/
#
# Usage:
#   kind create cluster --config=./yaml/kind-multiple-node.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Disable the default CNI (kindnet) to deploy Cilium, which supports multicast for ROS 2.
  # Nodes stay NotReady until CNI plugin is deployed, see docs/Setup_Virtualized_Cluster.md.
  disableDefaultCNI: true
  #podSubnet: "10.244.0.0/16"
  #serviceSubnet: "10.96.0.0/16"
nodes:
- role: control-plane
  # Pin the node image to specific Kubernetes version if necessary.
  # see https://github.com/kubernetes-sigs/kind/releases for the pre-built node images.
  #image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
- role: worker
  #image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
- role: worker
  #image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
